<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - VIXIE</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root { --primary: #dc2626; --bg: #0a0a0f; --bg2: #1a1a2e; --text: #fff; --muted: #94a3b8; --border: #334155; --success: #22c55e; --error: #ef4444; }
body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

.screen { display: none; }
.screen.active { display: block; }

.login { display: flex; align-items: center; justify-content: center; padding: 20px; min-height: 100vh; }
.login-box { background: var(--bg2); padding: 40px; border-radius: 16px; width: 100%; max-width: 320px; border: 1px solid var(--border); }
.logo { width: 50px; height: 50px; background: var(--primary); border-radius: 10px; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; }
h1 { text-align: center; margin-bottom: 24px; font-size: 20px; }
.form-group { margin-bottom: 16px; }
label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 14px; }
input, textarea, select { width: 100%; padding: 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 15px; font-family: inherit; }
input:focus, textarea:focus, select:focus { outline: none; border-color: var(--primary); }
textarea { min-height: 80px; resize: vertical; }
.btn { padding: 12px 20px; background: var(--primary); color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
.btn:hover { opacity: 0.9; }
.btn-sm { padding: 8px 14px; font-size: 13px; width: auto; }
.btn-outline { background: transparent; border: 1px solid var(--border); color: var(--muted); }
.btn-danger { background: var(--error); }
.btn-secondary { background: var(--bg2); border: 1px solid var(--border); color: var(--text); }

.header { background: var(--bg2); padding: 12px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; }
.logo-text { color: var(--primary); font-weight: bold; }
.header-right { display: flex; align-items: center; gap: 12px; }
.status { color: var(--success); font-size: 13px; }
.status.error { color: var(--error); }

.nav { display: flex; gap: 4px; padding: 10px 20px; background: var(--bg2); border-bottom: 1px solid var(--border); overflow-x: auto; flex-wrap: nowrap; }
.nav-btn { padding: 10px 16px; background: transparent; border: none; border-radius: 8px; color: var(--muted); cursor: pointer; white-space: nowrap; font-size: 13px; transition: 0.2s; }
.nav-btn:hover { background: rgba(255,255,255,0.05); }
.nav-btn.active { background: var(--primary); color: white; }

.content { padding: 20px; max-width: 900px; margin: 0 auto; }
.section { display: none; }
.section.active { display: block; }

.section-title { font-size: 18px; font-weight: 600; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }

.form-card { background: var(--bg2); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
.form-card-title { font-size: 15px; font-weight: 600; margin-bottom: 14px; color: var(--muted); }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.field-full { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 500px) { .field-row, .field-full { grid-template-columns: 1fr; } }
.help { font-size: 12px; color: var(--muted); margin-top: 4px; }

.list-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border); cursor: pointer; }
.list-item:last-child { border-bottom: none; }
.list-item:hover { background: rgba(255,255,255,0.03); }
.list-item-title { font-weight: 500; }
.list-item-meta { font-size: 12px; color: var(--muted); margin-top: 3px; }
.list-item-actions { display: flex; gap: 8px; }
.empty { padding: 30px; text-align: center; color: var(--muted); }

.save-bar { position: sticky; bottom: 0; background: var(--bg2); padding: 14px 20px; border-top: 1px solid var(--border); display: flex; gap: 12px; justify-content: flex-end; }

.toast { position: fixed; bottom: 80px; right: 20px; padding: 14px 24px; border-radius: 8px; font-weight: 500; z-index: 200; }
.toast-success { background: var(--success); }
.toast-error { background: var(--error); }
</style>
</head>
<body>
<!-- Login -->
<div class="screen login active" id="loginScreen">
<div class="login-box">
<div class="logo">V</div>
<h1>Admin Panel</h1>
<form id="loginForm">
<div class="form-group">
<label>Пароль</label>
<input type="password" id="password" required placeholder="Введите пароль">
</div>
<button type="submit" class="btn">Войти</button>
</form>
</div>
</div>

<!-- Admin -->
<div class="screen" id="adminScreen">
<header class="header">
<div class="logo-text">VIXIE Admin</div>
<div class="header-right">
<span class="status" id="saveStatus"></span>
<button class="btn btn-sm btn-outline" id="logoutBtn">Выйти</button>
</div>
</header>

<nav class="nav">
<button class="nav-btn active" data-tab="profile">Профиль</button>
<button class="nav-btn" data-tab="about">Обо мне</button>
<button class="nav-btn" data-tab="skills">Навыки</button>
<button class="nav-btn" data-tab="services">Услуги</button>
<button class="nav-btn" data-tab="portfolio">Портфолио</button>
<button class="nav-btn" data-tab="blog">Блог</button>
<button class="nav-btn" data-tab="meta">Настройки</button>
</nav>

<main class="content">
<!-- Профиль -->
<div class="section active" id="section-profile">
<div class="section-title">Профиль</div>
<div class="form-card">
<div class="form-card-title">Основное</div>
<div class="field-row">
<div class="form-group"><label>Имя</label><input id="p-name" value=""></div>
<div class="form-group"><label>Полное имя</label><input id="p-full_name" value=""></div>
</div>
<div class="field-row">
<div class="form-group"><label>Роль</label><input id="p-role" value=""></div>
<div class="form-group"><label>Возраст</label><input id="p-age" type="number" value=""></div>
</div>
</div>
<div class="form-card">
<div class="form-card-title">Контакты</div>
<div class="field-row">
<div class="form-group"><label>Email</label><input id="p-email" value=""></div>
<div class="form-group"><label>Discord</label><input id="p-discord" value=""></div>
</div>
<div class="field-row">
<div class="form-group"><label>Telegram</label><input id="p-telegram" value=""></div>
<div class="form-group"><label>GitHub</label><input id="p-github" value=""></div>
</div>
<div class="form-group"><label>YouTube</label><input id="p-youtube" value=""></div>
</div>
<div class="form-card">
<div class="form-card-title">Статус</div>
<div class="field-row">
<div class="form-group"><label>Текст статуса</label><input id="p-status_text" value=""></div>
<div class="form-group"><label>Цвет статуса</label><select id="p-status_color"><option value="green">Зелёный</option><option value="yellow">Жёлтый</option><option value="red">Красный</option><option value="blue">Синий</option></select></div>
</div>
</div>
</div>

<!-- Обо мне -->
<div class="section" id="section-about">
<div class="section-title">Обо мне</div>
<div class="form-card">
<div class="form-card-title">Информация</div>
<div class="form-group"><label>Заголовок</label><input id="a-title" value=""></div>
</div>
<div class="form-card">
<div class="form-card-title">Биография (каждый абзац отдельно)</div>
<div class="form-group"><label>Абзац 1</label><textarea id="a-bio-1"></textarea></div>
<div class="form-group"><label>Абзац 2</label><textarea id="a-bio-2"></textarea></div>
<div class="form-group"><label>Абзац 3</label><textarea id="a-bio-3"></textarea></div>
</div>
</div>

<!-- Навыки -->
<div class="section" id="section-skills">
<div class="section-title">Навыки</div>
<div class="form-card" id="skillsList"></div>
</div>

<!-- Услуги -->
<div class="section" id="section-services">
<div class="section-title">
<span>Услуги</span>
<button class="btn btn-sm" onclick="addItem('services')">+ Добавить</button>
</div>
<div class="form-card" id="servicesList"></div>
</div>

<!-- Портфолио -->
<div class="section" id="section-portfolio">
<div class="section-title">
<span>Портфолио</span>
<button class="btn btn-sm" onclick="addItem('portfolio')">+ Добавить</button>
</div>
<div class="form-card" id="portfolioList"></div>
</div>

<!-- Блог -->
<div class="section" id="section-blog">
<div class="section-title">
<span>Блог</span>
<button class="btn btn-sm" onclick="addItem('blog')">+ Добавить</button>
</div>
<div class="form-card" id="blogList"></div>
</div>

<!-- Настройки -->
<div class="section" id="section-meta">
<div class="section-title">Настройки сайта</div>
<div class="form-card">
<div class="form-card-title">Meta</div>
<div class="field-row">
<div class="form-group"><label>Название сайта</label><input id="m-site_name" value=""></div>
<div class="form-group"><label>Описание</label><input id="m-site_description" value=""></div>
</div>
</div>
<div class="form-card">
<div class="form-card-title">Тема</div>
<div class="field-row">
<div class="form-group"><label>Основной цвет</label><input id="m-primary_color" value=""></div>
<div class="form-group"><label>Вторичный цвет</label><input id="m-secondary_color" value=""></div>
</div>
</div>
</div>
</main>

<div class="save-bar">
<button class="btn btn-outline" onclick="saveAll()">Сохранить изменения</button>
</div>
</div>

<script>
const API = 'https://srv.zoliryzik.ru/api';
const PASSWORD = '99999999999999';
const TOKEN = 'vixie-admin-token';
let content = {};
let saved = false;

function toast(msg, type='success') {
  const t = document.createElement('div');
  t.className = 'toast toast-' + type;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

async function loadContent() {
  try {
    const res = await fetch(API + '/content');
    content = await res.json();
    fillForms();
    renderLists();
  } catch(e) { toast('Ошибка: ' + e.message, 'error'); }
}

function fillForms() {
  // Profile
  const p = content.profile || {};
  document.getElementById('p-name').value = p.name || '';
  document.getElementById('p-full_name').value = p.full_name || '';
  document.getElementById('p-role').value = p.role || '';
  document.getElementById('p-age').value = p.age || '';
  document.getElementById('p-email').value = p.email || '';
  document.getElementById('p-discord').value = p.socials?.discord || '';
  document.getElementById('p-telegram').value = p.socials?.telegram || '';
  document.getElementById('p-github').value = p.socials?.github || '';
  document.getElementById('p-youtube').value = p.socials?.youtube || '';
  document.getElementById('p-status_text').value = p.status?.text || '';
  document.getElementById('p-status_color').value = p.status?.color || 'green';
  
  // About
  const a = content.about || {};
  document.getElementById('a-title').value = a.title || '';
  const bio = a.bio || [];
  document.getElementById('a-bio-1').value = bio[0] || '';
  document.getElementById('a-bio-2').value = bio[1] || '';
  document.getElementById('a-bio-3').value = bio[2] || '';
  
  // Meta
  const m = content.meta || {};
  document.getElementById('m-site_name').value = m.site_name || '';
  document.getElementById('m-site_description').value = m.site_description || '';
  const t = content.theme || {};
  document.getElementById('m-primary_color').value = t.primary_color || '#dc2626';
  document.getElementById('m-secondary_color').value = t.secondary_color || '#8b5cf6';
}

function renderLists() {
  // Skills
  const skillsEl = document.getElementById('skillsList');
  const skills = content.skills || [];
  if (!skills.length) {
    skillsEl.innerHTML = '<div class="empty">Нет навыков</div>';
  } else {
    skillsEl.innerHTML = skills.map((s, i) => '<div class="list-item"><div><div class="list-item-title">'+s.name+'</div><div class="list-item-meta">Уровень: '+s.level+'%</div></div><input type="number" value="'+s.level+'" style="width:60px" data-type="skills" data-index="'+i+'" data-field="level" onchange="updateField(this)"></div>').join('');
  }
  
  // Services
  const servEl = document.getElementById('servicesList');
  const serv = content.services || [];
  if (!serv.length) {
    servEl.innerHTML = '<div class="empty">Нет услуг - нажми "+ Добавить"</div>';
  } else {
    servEl.innerHTML = serv.map(s => '<div class="list-item"><div class="list-item-title">'+s.title+'</div><div class="list-item-meta">'+s.price+'</div><div class="list-item-actions"><button class="btn btn-sm btn-outline" onclick="deleteItem(\'services\','+s.id+')">X</button></div></div>').join('');
  }
  
  // Portfolio
  const portEl = document.getElementById('portfolioList');
  const port = content.portfolio || [];
  if (!port.length) {
    portEl.innerHTML = '<div class="empty">Нет проектов</div>';
  } else {
    portEl.innerHTML = port.map(p => '<div class="list-item"><div class="list-item-title">'+p.title+'</div><div class="list-item-meta">'+p.category+'</div><div class="list-item-actions"><button class="btn btn-sm btn-outline" onclick="deleteItem(\'portfolio\','+p.id+')">X</button></div></div>').join('');
  }
  
  // Blog
  const blogEl = document.getElementById('blogList');
  const blog = content.blog || [];
  if (!blog.length) {
    blogEl.innerHTML = '<div class="empty">Нет постов</div>';
  } else {
    blogEl.innerHTML = blog.map(b => '<div class="list-item"><div class="list-item-title">'+b.title+'</div><div class="list-item-meta">'+b.category+'</div><div class="list-item-actions"><button class="btn btn-sm btn-outline" onclick="deleteItem(\'blog\','+b.id+')">X</button></div></div>').join('');
  }
}

function updateField(el) {
  const type = el.dataset.type;
  const index = parseInt(el.dataset.index);
  const field = el.dataset.field;
  content[type][index][field] = el.value;
}

function addItem(type) {
  const id = Date.now();
  if (type === 'services') {
    content.services = content.services || [];
    content.services.push({ id, title: 'Новая услуга', description: '', price: 'от 0', price_suffix: '₽', icon: 'bot' });
  } else if (type === 'portfolio') {
    content.portfolio = content.portfolio || [];
    content.portfolio.push({ id, title: 'Новый проект', category: 'web', description: '' });
  } else if (type === 'blog') {
    content.blog = content.blog || [];
    content.blog.push({ id, title: 'Новый пост', category: 'Tutorial', excerpt: '', content: '' });
  }
  renderLists();
  toast('Добавлено! Теперь сохрани изменения');
}

function deleteItem(type, id) {
  if (!confirm('Удалить?')) return;
  content[type] = content[type].filter(i => i.id !== id);
  renderLists();
  toast('Удалено');
}

function saveAll() {
  // Profile
  content.profile = content.profile || {};
  content.profile.name = document.getElementById('p-name').value;
  content.profile.full_name = document.getElementById('p-full_name').value;
  content.profile.role = document.getElementById('p-role').value;
  content.profile.age = parseInt(document.getElementById('p-age').value);
  content.profile.email = document.getElementById('p-email').value;
  content.profile.socials = {
    discord: document.getElementById('p-discord').value,
    telegram: document.getElementById('p-telegram').value,
    github: document.getElementById('p-github').value,
    youtube: document.getElementById('p-youtube').value
  };
  content.profile.status = {
    online: true,
    text: document.getElementById('p-status_text').value,
    color: document.getElementById('p-status_color').value
  };
  
  // About
  content.about = content.about || {};
  content.about.title = document.getElementById('a-title').value;
  content.about.bio = [
    document.getElementById('a-bio-1').value,
    document.getElementById('a-bio-2').value,
    document.getElementById('a-bio-3').value
  ];
  
  // Meta
  content.meta = content.meta || {};
  content.meta.site_name = document.getElementById('m-site_name').value;
  content.meta.site_description = document.getElementById('m-site_description').value;
  content.theme = content.theme || {};
  content.theme.primary_color = document.getElementById('m-primary_color').value;
  content.theme.secondary_color = document.getElementById('m-secondary_color').value;
  
  // Save to server
  fetch(API + '/admin/content', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + TOKEN },
    body: JSON.stringify(content)
  }).then(r => r.json()).then(d => {
    if (d.success) {
      document.getElementById('saveStatus').textContent = 'Сохранено!';
      toast('Сохранено на сервере!');
    } else {
      throw new Error(d.error);
    }
  }).catch(e => {
    document.getElementById('saveStatus').textContent = 'Ошибка';
    toast('Ошибка: ' + e.message, 'error');
  });
}

// Nav
document.querySelectorAll('.nav-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.getElementById('section-' + btn.dataset.tab).classList.add('active');
  });
});

// Login
document.getElementById('loginForm').addEventListener('submit', e => {
  e.preventDefault();
  if (document.getElementById('password').value === PASSWORD) {
    localStorage.setItem('admin_ok', '1');
    document.getElementById('loginScreen').classList.remove('active');
    document.getElementById('adminScreen').classList.add('active');
    loadContent();
  } else { toast('Неверный пароль', 'error'); }
});

document.getElementById('logoutBtn').addEventListener('click', () => {
  localStorage.removeItem('admin_ok');
  location.reload();
});

if (localStorage.getItem('admin_ok') === '1') {
  document.getElementById('loginScreen').classList.remove('active');
  document.getElementById('adminScreen').classList.add('active');
  loadContent();
}
</script>
</body>
</html>
