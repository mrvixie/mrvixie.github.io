<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - VIXIE</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --primary: #dc2626; --bg: #0a0a0f; --bg2: #1a1a2e; --text: #fff; --muted: #94a3b8; --border: #334155; --success: #22c55e; --error: #ef4444; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    
    .screen { display: none; }
    .screen.active { display: block; }
    
    .login { display: flex; align-items: center; justify-content: center; padding: 20px; }
    .login-box { background: var(--bg2); padding: 40px; border-radius: 16px; width: 100%; max-width: 320px; border: 1px solid var(--border); }
    .logo { width: 50px; height: 50px; background: var(--primary); border-radius: 10px; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; }
    h1 { text-align: center; margin-bottom: 24px; font-size: 20px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 14px; }
    input, textarea, select { width: 100%; padding: 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 15px; font-family: inherit; }
    input:focus, textarea:focus, select:focus { outline: none; border-color: var(--primary); }
    textarea { min-height: 100px; resize: vertical; }
    .btn { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
    .btn:hover { opacity: 0.9; }
    .btn-sm { width: auto; padding: 8px 16px; font-size: 14px; }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--muted); }
    .btn-danger { background: var(--error); }
    .btn-secondary { background: var(--bg2); border: 1px solid var(--border); color: var(--text); }
    
    .header { background: var(--bg2); padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; }
    .logo-text { color: var(--primary); font-weight: bold; }
    .nav { display: flex; gap: 6px; padding: 12px 20px; background: var(--bg2); border-bottom: 1px solid var(--border); overflow-x: auto; flex-wrap: nowrap; }
    .nav-btn { padding: 10px 18px; background: transparent; border: none; border-radius: 8px; color: var(--muted); cursor: pointer; white-space: nowrap; font-size: 14px; transition: 0.2s; }
    .nav-btn:hover { background: rgba(255,255,255,0.05); }
    .nav-btn.active { background: var(--primary); color: white; }
    
    .content { padding: 20px; max-width: 1200px; margin: 0 auto; }
    .section { display: none; }
    .section.active { display: block; }
    
    .card { background: var(--bg2); border-radius: 12px; margin-bottom: 20px; overflow: hidden; }
    .card-header { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .card-title { font-size: 16px; font-weight: 600; }
    
    .item { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border); }
    .item:last-child { border-bottom: none; }
    .item-info { flex: 1; min-width: 0; }
    .item-title { font-weight: 500; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-meta { font-size: 13px; color: var(--muted); }
    .item-actions { display: flex; gap: 8px; flex-shrink: 0; margin-left: 12px; }
    
    .empty { padding: 30px 20px; text-align: center; color: var(--muted); }
    
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
    .modal.active { display: flex; }
    .modal-box { background: var(--bg2); border-radius: 16px; width: 100%; max-width: 800px; max-height: 90vh; overflow-y: auto; }
    .modal-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: var(--bg2); }
    .modal-title { font-size: 18px; font-weight: 600; }
    .modal-close { background: none; border: none; color: var(--muted); font-size: 26px; cursor: pointer; line-height: 1; }
    .modal-body { padding: 20px; }
    .modal-footer { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; gap: 12px; justify-content: flex-end; position: sticky; bottom: 0; background: var(--bg2); }
    
    .field-group { margin-bottom: 14px; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 500px) { .field-row { grid-template-columns: 1fr; } }
    .help-text { font-size: 12px; color: var(--muted); margin-top: 4px; }
    
    .toast { position: fixed; bottom: 20px; right: 20px; padding: 12px 20px; border-radius: 8px; font-weight: 500; z-index: 200; animation: slide 0.3s; }
    .toast-success { background: var(--success); }
    .toast-error { background: var(--error); }
    @keyframes slide { from { transform: translateY(20px); opacity: 0; } to { transform: 0; opacity: 1; } }
  </style>
</head>
<body>
  <!-- Login -->
  <div class="screen login active" id="loginScreen">
    <div class="login-box">
      <div class="logo">V</div>
      <h1>Admin</h1>
      <form id="loginForm">
        <div class="form-group">
          <label>Пароль</label>
          <input type="password" id="password" required placeholder="Введите пароль">
        </div>
        <button type="submit" class="btn">Войти</button>
      </form>
    </div>
  </div>
  
  <!-- Admin -->
  <div class="screen" id="adminScreen">
    <header class="header">
      <div class="logo-text">VIXIE Admin</div>
      <button class="btn btn-sm btn-outline" id="logoutBtn">Выйти</button>
    </header>
    
    <nav class="nav">
      <button class="nav-btn active" data-tab="services">Услуги</button>
      <button class="nav-btn" data-tab="portfolio">Портфолио</button>
      <button class="nav-btn" data-tab="blog">Блог</button>
      <button class="nav-btn" data-tab="klondike">Клондайк</button>
      <button class="nav-btn" data-tab="content">Весь контент</button>
    </nav>
    
    <main class="content">
      <!-- Services -->
      <div class="section active" id="section-services">
        <div class="card">
          <div class="card-header">
            <span class="card-title">Услуги</span>
            <button class="btn btn-sm" onclick="editItem('services')">+ Добавить</button>
          </div>
          <div id="servicesList"></div>
        </div>
      </div>
      
      <!-- Portfolio -->
      <div class="section" id="section-portfolio">
        <div class="card">
          <div class="card-header">
            <span class="card-title">Портфолио</span>
            <button class="btn btn-sm" onclick="editItem('portfolio')">+ Добавить</button>
          </div>
          <div id="portfolioList"></div>
        </div>
      </div>
      
      <!-- Blog -->
      <div class="section" id="section-blog">
        <div class="card">
          <div class="card-header">
            <span class="card-title">Блог</span>
            <button class="btn btn-sm" onclick="editItem('blog')">+ Добавить</button>
          </div>
          <div id="blogList"></div>
        </div>
      </div>
      
      <!-- Klondike -->
      <div class="section" id="section-klondike">
        <div class="card">
          <div class="card-header">
            <span class="card-title">Клондайк</span>
            <button class="btn btn-sm" onclick="editItem('klondike')">+ Добавить</button>
          </div>
          <div id="klondikeList"></div>
        </div>
      </div>
      
      <!-- Content -->
      <div class="section" id="section-content">
        <div class="card">
          <div class="card-header">
            <span class="card-title">Весь контент (JSON)</span>
            <button class="btn btn-sm" onclick="downloadJSON()">Скачать</button>
          </div>
          <textarea id="fullContent" style="min-height:500px;font-family:monospace;font-size:13px;"></textarea>
        </div>
      </div>
    </main>
  </div>
  
  <!-- Modal -->
  <div class="modal" id="modal">
    <div class="modal-box">
      <div class="modal-header">
        <span class="modal-title" id="modalTitle">Редактирование</span>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer">
        <button class="btn btn-sm btn-secondary" onclick="closeModal()">Отмена</button>
        <button class="btn btn-sm" onclick="saveItem()">Сохранить</button>
      </div>
    </div>
  </div>
  
  <script>
    const PASSWORD = '99999999999999';
    const API = 'https://srv.zoliryzik.ru/api';
    let content = {};
    let currentType = '';
    let currentItem = null;
    let isNew = false;
    
    function toast(msg, type = 'success') {
      const t = document.createElement('div');
      t.className = 'toast toast-' + type;
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 3000);
    }
    
    async function loadContent() {
      try {
        const res = await fetch(API + '/content');
        content = await res.json();
        renderAll();
      } catch(e) {
        toast('Ошибка загрузки: ' + e.message, 'error');
      }
    }
    
    function renderAll() {
      renderList('services', content.services || []);
      renderList('portfolio', content.portfolio || []);
      renderList('blog', content.blog || []);
      renderList('klondike', content.klondike || []);
      document.getElementById('fullContent').value = JSON.stringify(content, null, 2);
    }
    
    function renderList(type, list) {
      const el = document.getElementById(type + 'List');
      if (!list || !list.length) {
        el.innerHTML = '<div class="empty">Нет данных</div>';
        return;
      }
      el.innerHTML = list.map(item => {
        let meta = '';
        if (type === 'services') meta = item.price || '';
        if (type === 'portfolio') meta = item.category || '';
        if (type === 'blog') meta = (item.category || '') + (item.date ? ' • ' + item.date : '');
        if (type === 'klondike') meta = (item.type || '') + (item.category ? ' • ' + item.category : '');
        
        return '<div class="item"><div class="item-info"><div class="item-title">' + (item.title || 'Без названия') + '</div><div class="item-meta">' + meta + '</div></div><div class="item-actions"><button class="btn btn-sm btn-outline" onclick="editItem(\'' + type + '\',' + item.id + ')">Ред</button><button class="btn btn-sm btn-danger" onclick="deleteItem(\'' + type + '\',' + item.id + ')">X</button></div></div>';
      }).join('');
    }
    
    function editItem(type, id = null) {
      currentType = type;
      isNew = !id;
      
      currentItem = id ? content[type].find(i => i.id === id) : {
        id: Date.now(),
        title: 'Новое',
        description: ''
      };
      
      if (isNew) {
        if (type === 'services') {
          currentItem = { id: currentItem.id, title: 'Новая услуга', description: '', price: 'от 0', price_suffix: '₽', features: [], icon: 'bot', popular: false };
        } else if (type === 'portfolio') {
          currentItem = { id: currentItem.id, title: 'Новый проект', category: 'web', description: '', image_url: '', content: '' };
        } else if (type === 'blog') {
          currentItem = { id: currentItem.id, title: 'Новый пост', category: 'Tutorial', excerpt: '', content: '', date: new Date().toISOString().split('T')[0], author: 'VIXIE', read_time: '5 мин' };
        } else if (type === 'klondike') {
          currentItem = { id: currentItem.id, title: 'Новый материал', category: 'articles', type: 'read', content: '' };
        }
        content[type].push(currentItem);
      }
      
      document.getElementById('modalTitle').textContent = (isNew ? 'Добавить' : 'Редактировать') + ' ' + type;
      
      let fields = '';
      if (type === 'services') {
        fields = '<div class="field-group"><label>Название</label><input id="f-title" value="' + escapeHtml(currentItem.title || '') + '"></div>' +
          '<div class="field-group"><label>Описание</label><textarea id="f-description">' + escapeHtml(currentItem.description || '') + '</textarea></div>' +
          '<div class="field-row"><div class="field-group"><label>Цена</label><input id="f-price" value="' + escapeHtml(currentItem.price || '') + '"></div>' +
          '<div class="field-group"><label>Иконка (bot/design/telegram)</label><input id="f-icon" value="' + escapeHtml(currentItem.icon || 'bot') + '"></div></div>';
      } else if (type === 'portfolio') {
        fields = '<div class="field-group"><label>Название</label><input id="f-title" value="' + escapeHtml(currentItem.title || '') + '"></div>' +
          '<div class="field-group"><label>Описание</label><textarea id="f-description">' + escapeHtml(currentItem.description || '') + '</textarea></div>' +
          '<div class="field-row"><div class="field-group"><label>Категория</label><input id="f-category" value="' + escapeHtml(currentItem.category || 'web') + '"></div>' +
          '<div class="field-group"><label>Изображение URL</label><input id="f-image_url" value="' + escapeHtml(currentItem.image_url || '') + '"></div></div>' +
          '<div class="field-group"><label>Контент (HTML)</label><textarea id="f-content" style="min-height:200px">' + escapeHtml(currentItem.content || '') + '</textarea></div>';
      } else if (type === 'blog') {
        fields = '<div class="field-group"><label>Заголовок</label><input id="f-title" value="' + escapeHtml(currentItem.title || '') + '"></div>' +
          '<div class="field-group"><label>Краткое описание</label><textarea id="f-excerpt">' + escapeHtml(currentItem.excerpt || '') + '</textarea></div>' +
          '<div class="field-group"><label>Полный контент (HTML)</label><textarea id="f-content" style="min-height:250px">' + escapeHtml(currentItem.content || '') + '</textarea></div>' +
          '<div class="field-row"><div class="field-group"><label>Категория</label><input id="f-category" value="' + escapeHtml(currentItem.category || 'Tutorial') + '"></div>' +
          '<div class="field-group"><label>Дата</label><input id="f-date" value="' + (currentItem.date || '') + '"></div></div>';
      } else if (type === 'klondike') {
        fields = '<div class="field-group"><label>Название</label><input id="f-title" value="' + escapeHtml(currentItem.title || '') + '"></div>' +
          '<div class="field-group"><label>Описание</label><textarea id="f-description">' + escapeHtml(currentItem.description || '') + '</textarea></div>' +
          '<div class="field-group"><label>Контент (код/текст)</label><textarea id="f-content">' + escapeHtml(currentItem.content || '') + '</textarea></div>' +
          '<div class="field-row"><div class="field-group"><label>Тип</label><select id="f-type"><option value="read">Читать</option><option value="copy">Копировать</option><option value="download">Скачать</option></select></div>' +
          '<div class="field-group"><label>Категория</label><input id="f-category" value="' + escapeHtml(currentItem.category || 'articles') + '"></div></div>' +
          '<div class="field-group"><label>Команда (если есть)</label><input id="f-command" value="' + escapeHtml(currentItem.command || '') + '"></div>';
      }
      
      document.getElementById('modalBody').innerHTML = fields;
      if (currentItem.type) document.getElementById('f-type').value = currentItem.type;
      document.getElementById('modal').classList.add('active');
    }
    
    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    
    function closeModal() {
      document.getElementById('modal').classList.remove('active');
      if (isNew && currentType && currentItem) {
        content[currentType] = content[currentType].filter(i => i.id !== currentItem.id);
      }
      currentItem = null;
    }
    
    function saveItem() {
      if (!currentItem || !currentType) return;
      
      try {
        if (currentType === 'services') {
          currentItem.title = document.getElementById('f-title').value;
          currentItem.description = document.getElementById('f-description').value;
          currentItem.price = document.getElementById('f-price').value;
          currentItem.icon = document.getElementById('f-icon').value;
        } else if (currentType === 'portfolio') {
          currentItem.title = document.getElementById('f-title').value;
          currentItem.description = document.getElementById('f-description').value;
          currentItem.category = document.getElementById('f-category').value;
          currentItem.image_url = document.getElementById('f-image_url').value;
          currentItem.content = document.getElementById('f-content').value;
        } else if (currentType === 'blog') {
          currentItem.title = document.getElementById('f-title').value;
          currentItem.excerpt = document.getElementById('f-excerpt').value;
          currentItem.content = document.getElementById('f-content').value;
          currentItem.category = document.getElementById('f-category').value;
          currentItem.date = document.getElementById('f-date').value;
        } else if (currentType === 'klondike') {
          currentItem.title = document.getElementById('f-title').value;
          currentItem.description = document.getElementById('f-description').value;
          currentItem.content = document.getElementById('f-content').value;
          currentItem.type = document.getElementById('f-type').value;
          currentItem.category = document.getElementById('f-category').value;
          currentItem.command = document.getElementById('f-command').value;
        }
        
        renderAll();
        closeModal();
        toast('Сохранено!');
      } catch(e) {
        toast('Ошибка: ' + e.message, 'error');
      }
    }
    
    function deleteItem(type, id) {
      if (!confirm('Удалить?')) return;
      content[type] = (content[type] || []).filter(i => i.id !== id);
      renderAll();
      toast('Удалено');
    }
    
    function downloadJSON() {
      const blob = new Blob([JSON.stringify(content, null, 2)], {type: 'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'content.json';
      a.click();
      URL.revokeObjectURL(url);
      toast('Скачайте файл и загрузите на сервер');
    }
    
    // Login
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      if (document.getElementById('password').value === PASSWORD) {
        localStorage.setItem('admin_ok', '1');
        document.getElementById('loginScreen').classList.remove('active');
        document.getElementById('adminScreen').classList.add('active');
        loadContent();
      } else {
        toast('Неверный пароль', 'error');
      }
    });
    
    // Logout
    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('admin_ok');
      location.reload();
    });
    
    // Tabs
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById('section-' + btn.dataset.tab).classList.add('active');
      });
    });
    
    // Check auth
    if (localStorage.getItem('admin_ok') === '1') {
      document.getElementById('loginScreen').classList.remove('active');
      document.getElementById('adminScreen').classList.add('active');
      loadContent();
    }
  </script>
</body>
</html>
